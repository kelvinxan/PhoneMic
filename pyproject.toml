[project]
name = "phonemic"
version = "0.6.1"
description = "PhoneMic: 手机语音桥接输入法"
authors = [
    {name = "phonemic team"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pywin32>=311,<312",
    "pyperclip>=1.11.0,<2.0.0",
    "pyautogui>=0.9.54,<0.10.0",
    "netifaces>=0.11.0,<0.12.0",
    "psutil>=7.2.2,<8.0.0",
    "pyside6>=6.11.1,<7.0.0",
    "qrcode>=8.2,<9.0",
    "pyparsing>=3.1,<4.0",
    "starlette>=1.6.0,<1.7.0",
    "uvicorn[standard]>=0.47.0,<0.48.0",
    "pynacl>=1.6.0,<2.0.0",
    "msgpack>=1.2.2",
]

[project.scripts]
app = "phonemic.PhoneMic:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "isort>=8.0.1,<9.0.0",
    "websockets>=16.0,<17.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-qt>=4.5.0,<5.0.0",
    # 上限卡在 4.2.2：Nuitka 4.3 在 Python 3.13 + PySide6 6.11 下打包后，
    # 任何把绑定方法（obj.method）连接到 Qt 信号的代码都会在运行时段错误
    # （access violation，界面起不来）。4.2.2 实测正常，升级前需先回归验证。
    "nuitka>=4.1.1,<=4.2.2",
    "ordered-set>=4.1.0,<5.0.0",
    "zstandard>=0.25.0,<0.26.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-playwright>=0.7.0,<1.0.0",
]
